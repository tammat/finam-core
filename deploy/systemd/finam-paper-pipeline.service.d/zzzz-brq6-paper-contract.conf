[Service]
ExecStart=
ExecStart=/bin/bash -lc 'set -a; source /opt/finam-core/.env; set +a; export FINAM_TOKEN="$FINAM_SECRET"; /opt/finam-core/venv/bin/python -u src/scripts/run_market_pipeline.py --symbol BRQ6@RTSX --symbols BRQ6@RTSX,NGN6@RTSX,USDRUBF@RTSX,SBERP@MISX,PLZL@MISX,LKOH@MISX,VTBR@MISX,NVTK@MISX,X5@MISX,SFIN@MISX,OZON@MISX,EUTR@MISX,T@MISX --strategy vwap_bands_mr --run-secs 0 --quote-log-every 30 --enable-filter-engine'

Environment=ACTIVE_BR_SYMBOL=BRQ6@RTSX
Environment=BR_CONTRACT=BRQ6@RTSX
Environment=BR_BREAKOUT_SYMBOL=BRQ6@RTSX
Environment=BR_STRICT_EDGE_BYPASS_SYMBOL=BRQ6@RTSX
Environment=BR_SESSION_SIDE_GATE_BYPASS_SYMBOL=BRQ6@RTSX
Environment=PAPER_CLUSTER_BLOCK_BYPASS_SYMBOLS=NGN6@RTSX,NGM6@RTSX,NGQ6@RTSX,BRQ6@RTSX
