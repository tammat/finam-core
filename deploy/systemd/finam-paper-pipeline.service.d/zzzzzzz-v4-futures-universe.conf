[Service]
# Канонический активный контракт газа и отдельные валютные/металлические потоки.
# Сами Paper-входы остаются закрыты DB-флагом v4_paper_enabled до готовности
# контракта, свежего стакана, покрытия >= 80% и модели реальных издержек.
ExecStart=
ExecStart=/bin/bash -lc 'set -a; source /opt/finam-core/.env; set +a; export FINAM_TOKEN="$FINAM_SECRET"; /opt/finam-core/venv/bin/python -u src/scripts/run_market_pipeline.py --symbol BRQ6@RTSX --symbols BRQ6@RTSX,NGQ6@RTSX,CNYRUBF@RTSX,USDRUBF@RTSX,GDU6@RTSX,SBER@MISX,GAZP@MISX,LKOH@MISX,NVTK@MISX,VTBR@MISX --strategy strategy_stack --run-secs 0 --quote-log-every 30 --enable-filter-engine'

Environment="ACTIVE_NG_SYMBOL=NGQ6@RTSX"
Environment="NG_CONTRACT=NGQ6@RTSX"
Environment="NG_M1_BREAKOUT_SYMBOL=NGQ6@RTSX"
Environment="GOLD_SYMBOL=GDU6@RTSX"
Environment="ENABLE_RUNTIME_ACTIVE_UNIVERSE_GATE=1"
Environment="ENABLE_RUNTIME_SYMBOL_RELOAD=1"
Environment="RUNTIME_SYMBOL_RELOAD_LIMIT=10"
Environment="PAPER_CLUSTER_BLOCK_BYPASS_SYMBOLS=NGQ6@RTSX,BRQ6@RTSX"
