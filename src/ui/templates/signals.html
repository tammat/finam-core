{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>Последние GOLD shadow-сигналы</h2>
    <table>
        <tr><th>Время</th><th>Инструмент</th><th>TF</th><th>Сторона</th><th>Цена</th><th>Причина</th></tr>
        {% for row in data.gold_signal_rows %}
        <tr>
            <td>{{ row.signal_ts }}</td>
            <td>{{ row.symbol }}</td>
            <td>{{ row.timeframe }}</td>
            <td>{{ row.side }}</td>
            <td>{{ row.entry_price }}</td>
            <td>{{ row.reason }}</td>
        </tr>
        {% endfor %}
    </table>
</section>
{% endblock %}
